name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: RtspViewer-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to branch "apk"
        run: |
          mkdir out && cp app/build/outputs/apk/debug/app-debug.apk out/RtspViewer.apk
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add RtspViewer.apk
          git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
